version: '3.8'

services:
  # API and Processing Service
  wsi-processor:
    build:
      context: ..  # Build from project root
      dockerfile: deployment/Dockerfile
    shm_size: '16gb'
    image: wsi-processor:latest
    container_name: wsi-processor
    ports:
      - "5000:5000"
    volumes:
      - ../data/uploads:/data/uploads
      - ../data/results:/data/results 
      - ../checkpoints:/app/checkpoints
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - CHECKPOINT_DIR=/app/checkpoints
      - UPLOAD_DIR=/data/uploads
      - RESULTS_DIR=/data/results
      - MAX_WORKERS=2
      - GPU_COUNT=1
    # Using manual device mapping instead of deploy.resources
    devices:
      - /dev/nvidia1:/dev/nvidia1
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    restart: unless-stopped

  # Health Monitoring
  healthcheck:
    image: busybox
    depends_on:
      - wsi-processor
    command: |
      /bin/sh -c "
      while true; do
        wget -q --spider http://wsi-processor:5000/api/health || echo 'WSI Processor is down!';
        sleep 60;
      done
      "

volumes:
  uploads:
  results:
  checkpoints: